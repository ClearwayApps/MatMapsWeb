<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#090708">
    <meta name="referrer" content="no-referrer">
    <meta name="description" content="Open shared MatMaps content in the app.">
    <meta property="og:site_name" content="MatMaps">
    <meta property="og:title" content="Open in MatMaps">
    <meta property="og:description" content="Find clubs, connect with fighters and train with MatMaps.">
    <meta property="og:image" content="https://matmaps.co.uk/assets/image/matMaps_logo.png">
    <meta property="og:type" content="website">
    <title>Open in MatMaps</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #090708;
        color: #fff;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(circle at 50% 6%, rgba(220, 20, 60, .28), transparent 34rem),
          linear-gradient(155deg, #160b0e 0%, #090708 55%, #050405 100%);
      }

      main {
        width: min(100%, 460px);
        padding: 34px 26px 28px;
        text-align: center;
        border: 1px solid rgba(255, 91, 107, .28);
        border-radius: 28px;
        background: linear-gradient(145deg, rgba(42, 21, 27, .96), rgba(15, 10, 12, .98));
        box-shadow: 0 24px 70px rgba(0, 0, 0, .58), 0 0 38px rgba(220, 20, 60, .12);
      }

      img {
        width: 138px;
        height: 138px;
        object-fit: contain;
        filter: drop-shadow(0 14px 24px rgba(0, 0, 0, .45));
      }

      .eyebrow {
        margin: 18px 0 7px;
        color: #ff6973;
        font-size: .76rem;
        font-weight: 800;
        letter-spacing: .16em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(1.75rem, 7vw, 2.4rem);
        line-height: 1.08;
        letter-spacing: -.04em;
      }

      p {
        margin: 14px auto 25px;
        max-width: 34ch;
        color: #d3c7ca;
        line-height: 1.55;
      }

      a {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 50px;
        border-radius: 14px;
        font-weight: 800;
        text-decoration: none;
      }

      #open-app {
        color: #fff;
        border: 1px solid #ff6a71;
        background: linear-gradient(135deg, #e31b23, #9d152a);
        box-shadow: 0 12px 25px rgba(227, 27, 35, .28);
      }

      .fallback {
        margin-top: 11px;
        color: #f3e9eb;
        border: 1px solid rgba(255, 255, 255, .18);
        background: rgba(255, 255, 255, .055);
      }

      small {
        display: block;
        margin-top: 17px;
        color: #93878a;
        line-height: 1.45;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/assets/image/matMaps_logo.png" alt="MatMaps logo">
      <div class="eyebrow">MatMaps</div>
      <h1 id="link-title">Open in MatMaps</h1>
      <p id="link-description">Find clubs, connect with fighters and train with MatMaps.</p>
      <a id="open-app" href="/">Open in the MatMaps app</a>
      <a class="fallback" href="/#download">Get MatMaps</a>
      <small>If MatMaps is installed, the first button opens this item in the app. Otherwise, you can continue on the MatMaps website.</small>
    </main>
    <script>
      (() => {
        const content = {
          staff: {
            title: 'Club staff invitation',
            description: 'You have been invited to join a MatMaps club team. Open the secure, one-time invitation in the app.'
          },
          posts: {
            title: 'MatMaps post',
            description: 'Open this shared post in MatMaps to view the conversation and connect with the community.'
          },
          clubs: {
            title: 'MatMaps club',
            description: 'Open this club in MatMaps to view its details, sports, events and media.'
          },
          profiles: {
            title: 'MatMaps profile',
            description: 'Open this member profile in MatMaps.'
          }
        };

        const path = window.location.pathname;
        const type = path === '/staff-invite'
          ? 'staff'
          : ['posts', 'clubs', 'profiles'].find((name) => path.startsWith(`/${name}/`));
        const selected = content[type] || {
          title: 'Open in MatMaps',
          description: 'Find clubs, connect with fighters and train with MatMaps.'
        };

        document.title = `${selected.title} | MatMaps`;
        document.getElementById('link-title').textContent = selected.title;
        document.getElementById('link-description').textContent = selected.description;
        document.getElementById('open-app').href = window.location.href;
      })();
    </script>
  </body>
</html>
