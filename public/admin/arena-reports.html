<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="../assets/image/matMaps_logo.png"><title>Arena Reports - MatMaps</title>
    <script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>tailwind.config={theme:{extend:{colors:{indigo:{400:'#E63935',500:'#B71C1C',600:'#931A16',700:'#7A1310',800:'#5F0E0B'}}}}};</script>
</head>
<body id="mainBodyFramework" class="bg-gray-950 text-gray-100 font-sans antialiased hidden">
<div class="flex h-screen overflow-hidden relative">
    <div id="sidebarOverlay" class="fixed inset-0 bg-black/50 z-20 hidden md:hidden"></div>
    <aside id="sidebarPanel" class="w-64 bg-gray-900 border-r border-gray-800 flex flex-col justify-between fixed md:static inset-y-0 left-0 -translate-x-full md:translate-x-0 z-30 transition-transform duration-300">
        <div><div class="h-16 flex items-center px-6 border-b border-gray-700 justify-between md:justify-center"><div class="flex items-center"><img src="../assets/image/matMaps_logo.png" alt="logo" class="h-9"><span class="text-xl font-bold text-indigo-400 ml-4">MatMaps</span></div><button id="closeSidebar" class="text-gray-400 md:hidden"><i class="fa-solid fa-xmark"></i></button></div>
            <nav class="p-4 space-y-2">
                <a href="dashboard.html" class="flex items-center space-x-3 px-4 py-2.5 rounded-lg text-gray-400 hover:bg-gray-800 hover:text-white"><i class="fa-solid fa-chart-pie w-5"></i><span>Dashboard</span></a>
                <a href="clubs.html" class="flex items-center space-x-3 px-4 py-2.5 rounded-lg text-gray-400 hover:bg-gray-800 hover:text-white"><i class="fa-solid fa-map-pin w-5"></i><span>Clubs Manager</span></a>
                <a href="events.html" class="flex items-center space-x-3 px-4 py-2.5 rounded-lg text-gray-400 hover:bg-gray-800 hover:text-white"><i class="fa-solid fa-calendar-days w-5"></i><span>Events Manager</span></a>
                <a href="posts-collections.html" class="flex items-center space-x-3 px-4 py-2.5 rounded-lg text-gray-400 hover:bg-gray-800 hover:text-white"><i class="fa-solid fa-images w-5"></i><span>Posts & Comments</span></a>
                <a href="reviews.html" class="flex items-center space-x-3 px-4 py-2.5 rounded-lg text-gray-400 hover:bg-gray-800 hover:text-white"><i class="fa-solid fa-star w-5"></i><span>Reviews</span></a>
                <a id="arenaReportsAdminLink" href="arena-reports.html" class="flex items-center space-x-3 px-4 py-2.5 rounded-lg bg-indigo-600 text-white"><i class="fa-solid fa-shield-halved w-5"></i><span>Arena Reports</span></a>
                <a id="phase2AdminLink" href="phase2-controls.html" class="flex items-center space-x-3 px-4 py-2.5 rounded-lg text-gray-400 hover:bg-gray-800 hover:text-white"><i class="fa-solid fa-layer-group w-5"></i><span>Launch Controls</span></a>
            </nav>
        </div>
        <div class="p-4 border-t border-gray-700 flex items-center justify-between"><div><p class="text-sm font-semibold">MatMaps Admin</p><p class="text-xs text-gray-500">Moderation queue</p></div><button id="logoutBtn" class="text-gray-400 hover:text-rose-500 p-2"><i class="fa-solid fa-right-from-bracket"></i></button></div>
    </aside>
    <main class="flex-1 overflow-y-auto">
        <header class="h-16 bg-gray-900 border-b border-gray-800 flex items-center justify-between px-5 md:px-8 sticky top-0 z-10"><div class="flex items-center gap-3"><button id="openSidebar" class="text-gray-400 md:hidden"><i class="fa-solid fa-bars"></i></button><i class="fa-solid fa-shield-halved text-indigo-400"></i><div><h1 class="font-bold">Arena Reports</h1><p class="text-[10px] text-gray-500">User reports and automatic moderation</p></div></div><button id="refreshBtn" class="bg-gray-800 border border-gray-700 px-3 py-2 rounded-lg text-xs"><i class="fa-solid fa-rotate mr-2"></i>Refresh</button></header>
        <div class="p-4 md:p-8 max-w-6xl mx-auto space-y-5">
            <div class="grid sm:grid-cols-3 gap-3"><div class="bg-gray-900 border border-gray-800 rounded-xl p-4"><p class="text-[10px] uppercase text-gray-500">Pending</p><p id="pendingCount" class="text-2xl font-black mt-1 text-amber-400">—</p></div><div class="bg-gray-900 border border-gray-800 rounded-xl p-4"><p class="text-[10px] uppercase text-gray-500">Automatic flags</p><p id="automaticCount" class="text-2xl font-black mt-1">—</p></div><div class="bg-gray-900 border border-gray-800 rounded-xl p-4"><p class="text-[10px] uppercase text-gray-500">Resolved</p><p id="resolvedCount" class="text-2xl font-black mt-1 text-emerald-400">—</p></div></div>
            <div class="bg-gray-900 border border-gray-800 rounded-2xl overflow-hidden"><div class="p-4 border-b border-gray-800 flex flex-col md:flex-row gap-3 justify-between"><div class="flex gap-2"><button data-status="pending" class="filter bg-indigo-600 text-white px-4 py-2 rounded-lg text-xs font-bold">Pending</button><button data-status="all" class="filter bg-gray-800 text-gray-400 px-4 py-2 rounded-lg text-xs font-bold">All reports</button></div><input id="searchInput" class="bg-gray-950 border border-gray-800 rounded-lg px-3 py-2 text-xs md:w-72 focus:outline-none focus:border-indigo-500" placeholder="Search report content or reason"></div><div id="reports" class="p-4 md:p-6 space-y-4 min-h-[360px]"></div></div>
        </div>
    </main>
</div>
<script src="./firebase-config.js"></script><script type="module" src="./notifications-manager.js"></script>
<script type="module">
import {initializeApp,getApps,getApp} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import {getAuth,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
import {getFunctions,httpsCallable} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-functions.js";
import {requireAdminAccess} from "./admin-access.js";
const app=getApps().length?getApp():initializeApp(window.FIREBASE_CONFIG||{});const auth=getAuth(app);const functions=getFunctions(app,'europe-west2');const getLaunchData=httpsCallable(functions,'adminGetLaunchData');const moderateReport=httpsCallable(functions,'moderateArenaReport');
const container=document.getElementById('reports');const search=document.getElementById('searchInput');let statusFilter='pending';let reports=[];let users={};
const esc=(value)=>String(value??'').replace(/[&<>'"]/g,(char)=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));const idFrom=(path)=>String(path||'').split('/').pop()||'';const formatDate=(value)=>{const date=new Date(value||0);return isNaN(date.getTime())?'—':date.toLocaleString('en-GB',{dateStyle:'medium',timeStyle:'short'});};const empty=(title,message)=>`<div class="py-16 text-center"><i class="fa-solid fa-shield-heart text-3xl text-gray-700"></i><h3 class="font-bold mt-3">${esc(title)}</h3><p class="text-sm text-gray-500 mt-1">${esc(message)}</p></div>`;
async function load(first=false){container.innerHTML='<div class="py-20 text-center"><i class="fa-solid fa-circle-notch fa-spin text-indigo-400 text-2xl"></i></div>';try{const response=await getLaunchData({section:'reports'});reports=response.data.arena_reports||[];users=Object.fromEntries((response.data.admin_users||[]).map((item)=>[item.id,item]));updateCounts();render();if(first)document.getElementById('mainBodyFramework').classList.remove('hidden');}catch(error){console.error(error);document.getElementById('mainBodyFramework').classList.remove('hidden');container.innerHTML=empty('Administrator access required',error.message||'Reports could not load.');}}
function updateCounts(){document.getElementById('pendingCount').textContent=reports.filter((item)=>item.status==='pending').length;document.getElementById('automaticCount').textContent=reports.filter((item)=>item.source==='automatic').length;document.getElementById('resolvedCount').textContent=reports.filter((item)=>item.status!=='pending').length;}
function render(){const needle=search.value.trim().toLowerCase();const filtered=reports.filter((item)=>(statusFilter==='all'||item.status==='pending')&&(!needle||[item.reason,item.contentSnapshot,item.moderationCategory,item.itemType,item.status,item.source].some((value)=>String(value||'').toLowerCase().includes(needle)))).sort((a,b)=>new Date(b.createdAt||0)-new Date(a.createdAt||0));if(!filtered.length){container.innerHTML=empty(statusFilter==='pending'?'No pending reports':'No reports found',statusFilter==='pending'?'The Arena moderation queue is clear.':'Try another search.');return;}container.innerHTML=filtered.map((item)=>{const reported=users[idFrom(item.reportedUserRef)]||{};const reporter=users[idFrom(item.reporterRef)]||{};const pending=item.status==='pending';const source=item.source==='automatic'?'<span class="text-[10px] uppercase font-bold px-2 py-1 rounded-full bg-violet-500/10 text-violet-400 border border-violet-500/20">Automatic</span>':'<span class="text-[10px] uppercase font-bold px-2 py-1 rounded-full bg-blue-500/10 text-blue-400 border border-blue-500/20">User report</span>';return `<article class="bg-gray-950 border ${pending?'border-amber-500/20':'border-gray-800'} rounded-xl p-5"><div class="flex flex-col md:flex-row md:items-start justify-between gap-3"><div><div class="flex flex-wrap items-center gap-2">${source}<span class="text-[10px] uppercase font-bold px-2 py-1 rounded-full bg-gray-800 text-gray-300">${esc(item.itemType||'content')}</span><span class="text-[10px] uppercase font-bold text-gray-500">${esc(item.status||'pending')}</span></div><h3 class="font-bold mt-3">${esc(item.reason||'Reported Arena content')}</h3><p class="text-[10px] text-gray-500 mt-1">${esc(formatDate(item.createdAt))} • ${esc(item.itemRef||item.path)}</p></div>${pending?`<div class="flex flex-wrap gap-2"><button data-action="keep" data-path="${esc(item.path)}" class="bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-3 py-2 rounded-lg text-xs"><i class="fa-solid fa-eye mr-1"></i>Keep visible</button><button data-action="dismiss" data-path="${esc(item.path)}" class="bg-gray-800 text-gray-300 px-3 py-2 rounded-lg text-xs">Dismiss</button><button data-action="remove" data-path="${esc(item.path)}" class="bg-rose-500/10 text-rose-400 border border-rose-500/20 px-3 py-2 rounded-lg text-xs"><i class="fa-solid fa-eye-slash mr-1"></i>Remove</button></div>`:''}</div><div class="bg-gray-900 border border-gray-800 rounded-lg p-4 mt-4 text-sm text-gray-300 whitespace-pre-wrap">${esc(item.contentSnapshot||'No content snapshot was stored.')}</div><div class="grid sm:grid-cols-2 gap-2 mt-3 text-[11px] text-gray-500"><p>Posted by: <span class="text-gray-300">${esc(reported.display_name||reported.username||idFrom(item.reportedUserRef)||'Unknown')}</span></p><p>Reported by: <span class="text-gray-300">${esc(item.source==='automatic'?'Automatic moderation':reporter.display_name||reporter.username||idFrom(item.reporterRef)||'Unknown')}</span></p></div>${item.resolutionNote?`<p class="mt-3 text-xs text-gray-500">Admin note: ${esc(item.resolutionNote)}</p>`:''}</article>`;}).join('');}
container.addEventListener('click',async(event)=>{const button=event.target.closest('[data-action]');if(!button)return;const action=button.dataset.action;const note=action==='remove'?prompt('Optional removal note for the audit record:',''):' ';if(note===null)return;if(!confirm(`${action[0].toUpperCase()+action.slice(1)} this report?`))return;button.disabled=true;try{await moderateReport({reportPath:button.dataset.path,action,note:note.trim()});alert(`Report ${action} action completed.`);await load();}catch(error){console.error(error);alert(`Error: ${error.message}`);}finally{button.disabled=false;}});
document.querySelectorAll('.filter').forEach((button)=>button.addEventListener('click',()=>{document.querySelectorAll('.filter').forEach((item)=>item.className='filter bg-gray-800 text-gray-400 px-4 py-2 rounded-lg text-xs font-bold');button.className='filter bg-indigo-600 text-white px-4 py-2 rounded-lg text-xs font-bold';statusFilter=button.dataset.status;render();}));search.addEventListener('input',render);document.getElementById('refreshBtn').addEventListener('click',()=>load());document.getElementById('logoutBtn').addEventListener('click',()=>signOut(auth));
const sidebar=document.getElementById('sidebarPanel');const overlay=document.getElementById('sidebarOverlay');document.getElementById('openSidebar').addEventListener('click',()=>{sidebar.classList.remove('-translate-x-full');overlay.classList.remove('hidden');});const closeMenu=()=>{sidebar.classList.add('-translate-x-full');overlay.classList.add('hidden');};document.getElementById('closeSidebar').addEventListener('click',closeMenu);overlay.addEventListener('click',closeMenu);
let started=false;onAuthStateChanged(auth,async(user)=>{if(!(await requireAdminAccess(auth,user)))return;if(started)return;started=true;load(true);});
</script>
</body></html>
